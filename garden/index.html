<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DIY · Garden Workshop</title>
    <meta name="description" content="Click around a comic garden: build and fill raised beds, companion planting, compost, hydroponics, preserving the harvest and care for dozens of plants." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="../"><span class="brand-mark"><i data-icon="wrench" data-size="20"></i></span> DIY <span class="crumb">/ Garden</span></a>
        <span class="spacer"></span>
        <div class="topbar-actions">
          <button id="plants-btn" class="ghost-btn"><i data-icon="sprout" data-size="16"></i><span class="lbl-long">Plant guide</span><span class="lbl-short">Plants</span></button>
          <button id="planner-btn" class="ghost-btn"><i data-icon="list" data-size="16"></i><span class="lbl-long">Bed planner</span><span class="lbl-short">Planner</span></button>
          <button id="guides-btn" class="ghost-btn"><i data-icon="book" data-size="16"></i>Guides</button>
        </div>
      </header>
      <main>
        <div class="stage">
          <canvas id="scene" aria-label="Interactive garden. Click an area to see how to build, grow or fix it."></canvas>
          <div class="garden-menu" id="garden-menu"></div>
          <div class="hint" id="hint">Drag to look around. Click a glowing dot.</div>
          <nav class="quick-fixes" id="quick-fixes" aria-label="Popular guides"></nav>
        </div>
        <aside class="panel" id="panel" aria-live="polite"></aside>
      </main>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/garden/main.ts"></script>
  </body>
</html>
