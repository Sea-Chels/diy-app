<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DIY · Garage</title>
    <meta name="description" content="Click a part of the car, motorcycle or bike, see what you can fix yourself, and watch how-to videos for your exact make, model and year." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="../"><span class="brand-mark"><i data-icon="wrench" data-size="20"></i></span> DIY <span class="crumb">/ Garage</span></a>
        <div class="picker" id="vehicle-picker"></div>
        <div class="topbar-actions">
          <button id="guides-btn" class="ghost-btn"><i data-icon="book" data-size="16"></i>Glossary</button>
        </div>
      </header>
      <main>
        <h1 class="sr-only">Garage workshop</h1>
        <div class="stage">
          <canvas id="scene" aria-label="Interactive garage with a car, a motorcycle and a bike. Click a part to see what you can fix."></canvas>
          <div class="scene-menu" id="paint-shop"></div>
          <div class="scene-menu seg ride-switch" id="ride-switch" role="group" aria-label="Vehicle"></div>
          <div class="hint" id="hint">Drag to look around. Click a glowing dot.</div>
          <nav class="quick-fixes" id="quick-fixes" aria-label="Quick fixes"></nav>
        </div>
        <aside class="panel" id="panel" aria-labelledby="panel-title"></aside>
      </main>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/garage/main.ts"></script>
  </body>
</html>
