name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      pages: true
    permissions:
      contents: read

  # Publishes the build CI tested; nothing is rebuilt here.
  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    # A deploy that has started finishes, so Pages never ends up half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
