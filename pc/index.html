<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DIY · PC Workshop</title>
    <meta name="description" content="Click a part of the PC to troubleshoot or replace it, walk through BIOS and OS setup, and check your parts fit together." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="../"><span class="brand-mark"><i data-icon="wrench" data-size="20"></i></span> DIY <span class="crumb">/ PC</span></a>
        <span class="spacer"></span>
        <div class="topbar-actions">
          <button id="builder-btn" class="ghost-btn"><i data-icon="list" data-size="16"></i>Parts picker</button>
          <button id="guides-btn" class="ghost-btn"><i data-icon="book" data-size="16"></i>Guides</button>
        </div>
      </header>
      <main>
        <div class="stage">
          <canvas id="scene" aria-label="Interactive PC. Click a part to see how to fix or replace it."></canvas>
          <div class="scene-menu" id="rig-menu"></div>
          <div class="hint" id="hint">Drag to look around. Click a glowing dot.</div>
          <nav class="quick-fixes" id="quick-fixes" aria-label="Popular guides"></nav>
        </div>
        <aside class="panel" id="panel" aria-labelledby="panel-title"></aside>
      </main>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/pc/main.ts"></script>
  </body>
</html>
